# Stage 1 production compose — Mac Studio runner, local build, loopback only.
# Deployed by .github/workflows/production-deploy.yml (v0.8).
#
# There is deliberately NO nginx service here. The host nginx at
# /opt/homebrew/etc/nginx/servers/witop-stage1.conf already reverse-proxies
# 127.0.0.1:8765 -> this container with Basic Auth on listen 8913. Adding a
# second nginx would give two competing front doors.
#
# 8765 is published to loopback only; 8913 is the externally reachable port.
#
# Required environment (supplied by the workflow, never committed):
#   WITOP_APP_IMAGE        local immutable tag built by the workflow, e.g. witop-production:2026.10.19-r3
#   SQLSERVER_CONFIG       fixed in-container path, /run/secrets/sqlserver_config.json
#   SQLSERVER_CONFIG_FILE  absolute host path to that JSON (mode 0600)
#   ANTHROPIC_API_KEY_FILE fixed in-container path to the Claude API key
#   ANTHROPIC_API_KEY_SOURCE absolute host path to the Claude API key file (mode 0600)
#   WITOP_AI_ACCESS_TOKEN_FILE fixed in-container path to the separate AI access token
#   WITOP_AI_ACCESS_TOKEN_SOURCE absolute host path to the AI access-token file (mode 0600)
#
# Every required value uses ":?" interpolation, so the stack fails closed instead
# of starting with a missing image tag or an unmounted secret. They are paths
# and tags only — no secret value ever appears in this file or in the
# `docker compose` command line.
#
# Working directory: this file contains no relative paths (no ./build context,
# no ./nginx.conf bind, no env_file). `docker compose -f <abs path> config`
# therefore resolves identically from any cwd. The workflow always passes the
# absolute path -f /Users/james/witop-prod/docker-compose.prod.yml and copies
# this file there before the first `docker compose` call.

name: witop-production

services:
  app:
    # Built by `docker build` in the deploy job; compose never builds.
    image: ${WITOP_APP_IMAGE:?Set WITOP_APP_IMAGE to an immutable local tag}
    environment:
      # Values are FILE PATHS, not inline credentials.
      SQLSERVER_CONFIG: ${SQLSERVER_CONFIG:?Set SQLSERVER_CONFIG to /run/secrets/sqlserver_config.json}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:?Set ANTHROPIC_API_KEY_FILE to /run/secrets/anthropic_api_key}
      WITOP_AI_ACCESS_TOKEN_FILE: ${WITOP_AI_ACCESS_TOKEN_FILE:?Set WITOP_AI_ACCESS_TOKEN_FILE to /run/secrets/ai_access_token}
    volumes:
      - type: bind
        source: ${SQLSERVER_CONFIG_FILE:?Set the host SQL config file path}
        target: /run/secrets/sqlserver_config.json
        read_only: true
        bind:
          # Fail closed: never let Docker create an empty directory in place
          # of the missing secret file.
          create_host_path: false
      - type: bind
        source: ${ANTHROPIC_API_KEY_SOURCE:?Set the host Claude API key file path}
        target: /run/secrets/anthropic_api_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WITOP_AI_ACCESS_TOKEN_SOURCE:?Set the host AI access-token file path}
        target: /run/secrets/ai_access_token
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Published (not exposed) so the host nginx can reach it; loopback only.
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
