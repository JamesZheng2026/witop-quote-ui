user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Deliberately omit request URI, query string, user name, and Authorization.
    log_format minimal '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout minimal;

    # Proposed deployment host: confirm ownership/DNS before release (DEPLOY.md).
    # No wildcard, arbitrary subdomain, localhost, HTTP, or null CORS origins.
    map $http_origin $cors_origin {
        default "";
        "https://reception.witop.com" "https://reception.witop.com";
    }
    map $http_origin $origin_rejected {
        default 1;
        "" 0;
        "https://reception.witop.com" 0;
    }
    map $host $host_rejected {
        default 1;
        reception.witop.com 0;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_buffering off;
    # Nginx validates the public host/origin first. Preserve the Node loopback
    # contract, and never trust client-supplied forwarded/Origin headers upstream.
    proxy_set_header Host "127.0.0.1:8765";
    proxy_set_header Origin "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    server {
        listen 80 default_server;
        server_name reception.witop.com;
        if ($origin_rejected) { return 403; }
        # Health is the sole HTTP/Host exception, including local IP probes;
        # it exposes no session data and the upstream Host is fixed above.
        location = /healthz { proxy_pass http://app:8765; }
        location / {
            if ($host_rejected) { return 444; }
            return 308 https://reception.witop.com$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name reception.witop.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        if ($host_rejected) { return 444; }
        if ($origin_rejected) { return 403; }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Vary "Origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Read-only customer data still requires authentication. CORS is not auth.
        auth_basic "Witop reception";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        location = /healthz {
            auth_basic off;
            proxy_pass http://app:8765;
        }
        location / {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://app:8765;
        }
    }
}
