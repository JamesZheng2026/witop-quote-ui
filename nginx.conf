user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Deliberately omit request URI, query string, user name, and Authorization.
    log_format minimal '$remote_addr $request_method $status $request_time';
    access_log /dev/stdout minimal;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_buffering off;
    # Validate same-origin requests here, then preserve the Node loopback contract.
    # Never trust client-supplied forwarded/Origin headers upstream.
    proxy_set_header Host "127.0.0.1:8765";
    proxy_set_header Origin "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    server {
        listen 80 default_server;
        server_name _;

        # IP access needs no domain allowlist. Permit absent Origin (CLI/navigation)
        # or the exact HTTP authority, including its port; reject all other origins.
        set $origin_rejected 0;
        set $same_origin "$scheme://$http_host";
        if ($http_origin != "") { set $origin_rejected 1; }
        if ($http_origin = $same_origin) { set $origin_rejected 0; }
        if ($origin_rejected) { return 403; }
        if ($http_sec_fetch_site = cross-site) { return 403; }

        # Internal HTTP only: transport must be protected by VPN or SSH tunneling.
        # Basic Auth is retained; it does not encrypt credentials or customer data.
        auth_basic "Witop reception";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        location = /healthz {
            auth_basic off;
            proxy_pass http://app:8765;
        }
        location / {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://app:8765;
        }
    }
}
