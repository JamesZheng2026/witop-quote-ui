name: stub-osxkeychain
description: Create DOCKER_CONFIG=/tmp/docker_cfg with credsStore="" to bypass osxkeychain under launchd
runs:
  using: composite
  steps:
    - run: |
        set -euo pipefail
        mkdir -p /tmp/docker_cfg
        printf '{"credsStore":""}' > /tmp/docker_cfg/config.json
        echo "DOCKER_CONFIG=/tmp/docker_cfg ready (credsStore empty string)"
      shell: bash
