# production-deploy.yml — v0.8 (Phase 6 Stage 1, Mac Studio local deploy)
# Shared SQL database plan A: Agent / agent_agent.
# SQL access is a read-only connectivity gate; all production mutations remain
# in the single deploy job behind environment:production manual approval.
#
# Stage 1 topology — no remote host, no registry:
#   host nginx (witop-stage1.conf, listen 8913, Basic Auth)
#     -> 127.0.0.1:8765  ==  this container
# The image is built locally with `docker build` and started with
# `docker compose up` on the self-hosted Mac Studio runner. Nothing is pushed to
# a registry and nothing is pulled from one.
#
# macOS runner wiring (proven by staging-deploy.yml, v2):
#   - DOCKER_HOST must point at the Docker Desktop socket; the default context
#     resolves to /var/run/docker.sock, which does not exist on macOS.
#   - docker/setup-buildx-action is NOT used. buildx calls the osxkeychain
#     credential helper for every base-image pull, and a launchd-run runner has
#     no keychain session, so builds fail. Plain `docker build` does not use it.
#   - ~/.docker/config.json is removed before building so no credsStore remains.
#
# Passwords are inherited through SQLCMDPASSWORD, never command-line values.

name: production-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable release tag, e.g. 2026.10.19-r3"
        required: true
        type: string
      deploy_confirm:
        description: 'Type DEPLOY (uppercase) to confirm'
        required: true
        type: string
      reason:
        description: "Short justification recorded in the DingTalk notice"
        required: false
        type: string
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Deployment root on the runner. The runner is uid 501 (james), so $HOME is
  # writable without sudo and /opt is not.
  APP_DIR: /Users/james/witop-prod
  COMPOSE_FILE: /Users/james/witop-prod/docker-compose.prod.yml
  # SQL Server lives on the Witop LAN; the app needs outbound routing to it.
  SQL_SERVER: "221.2.76.114"
  SQL_PORT: "5001"
  SQL_DATABASE: "Agent"
  SQL_USER: "agent_agent"
  # Container-local port, published to loopback only. 8913 (host nginx, Basic
  # Auth) is never probed by CI: an unauthenticated request there returns 401.
  APP_PORT: "8765"
  # Main routes: /healthz (SQL health), /api/receptions, / (root). /api/health does NOT exist.
  SMOKE_PATHS: "/healthz /api/receptions /"
  # /healthz cold start is ~4.5s because the bridge spawns python per request,
  # and the image HEALTHCHECK allows 35s. Smoke must not time out below that.
  SMOKE_MAX_TIME: "40"

jobs:
  # ── Pre-approval jobs (read-only / connectivity only) ───────────────────────

  validate:
    name: Validate inputs
    runs-on: [self-hosted, macos, ARM64, production]
    outputs:
      image_tag: ${{ steps.tidy.outputs.image_tag }}
      reason: ${{ steps.tidy.outputs.reason }}
    steps:
      - name: Confirm deploy gate
        env:
          CONFIRM: ${{ inputs.deploy_confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::deploy_confirm must equal DEPLOY (got '$CONFIRM')"
            exit 1
          fi

      - name: Validate and normalize inputs
        id: tidy
        env:
          RAW_TAG: ${{ inputs.image_tag }}
          RAW_REASON: ${{ inputs.reason }}
        run: |
          # Reject any line-feed or carriage-return in the tag.
          if printf '%s' "$RAW_TAG" | grep -qE '[\r\n]'; then
            echo "::error::image_tag must be a single line (no CR/LF)"
            exit 1
          fi
          # Strict immutable-release regex.
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::image_tag '$RAW_TAG' is not a valid immutable release tag"
            exit 1
          fi
          REASON=$(printf '%s' "$RAW_REASON" | tr -d '\r\n' | cut -c1-200)
          echo "image_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON"     >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight (Docker daemon + port 8765 survey)
    needs: validate
    runs-on: [self-hosted, macos, ARM64, production]
    env:
      # Docker Desktop on macOS: default context -> /var/run/docker.sock (missing).
      # Set DOCKER_HOST so all docker commands use the real desktop socket.
      DOCKER_HOST: unix:///Users/james/.docker/run/docker.sock
    steps:
      - name: Preflight - docker available on runner
        run: |
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker not found on runner. Install Docker Desktop, see DOCKER_SETUP.md"
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "::error::docker daemon not reachable. Start Docker Desktop and retry."
            exit 1
          fi
          echo "docker $(docker --version) ready"

      - name: Preflight - survey current port 8765 holder (read-only)
        run: |
          set -euo pipefail
          # Informational only. The deploy job stops the launchd service that
          # owns 8765 before compose publishes it.
          HOLDER=$(lsof -nP -iTCP:"$APP_PORT" -sTCP:LISTEN 2>/dev/null || true)
          if [ -n "$HOLDER" ]; then
            echo "Port $APP_PORT currently held by:"
            echo "$HOLDER"
          else
            echo "Port $APP_PORT is free."
          fi

  # ── Protected deployment job (requires manual approval) ─────────────────────
  #
  # ALL production writes (image build, secret staging, container replace) are
  # inside this single job, so ONE production environment approval gate covers
  # the entire blast radius.
  #
  # The environment "production" is configured in the GitHub repo settings with
  # required reviewers. GitHub holds the workflow run at this job until at least
  # one approved reviewer clicks Approve.
  #
  # If the runner is busy or offline, the workflow waits in the deploy job
  # queue (pending) rather than running preflight redundantly.

  deploy:
    name: Deploy + SQL (connectivity, build, compose up)
    needs: [validate, preflight]
    runs-on: [self-hosted, macos, ARM64, production]
    environment:
      name: production
      url: https://quote.witop.com.cn
    # P0-1 fix: all production mutations are in this single job, under ONE
    # environment:production approval gate. Static values are inherited from the
    # workflow-level env block because job-level env cannot reference ${{ env.* }}.
    env:
      DOCKER_HOST: unix:///Users/james/.docker/run/docker.sock
      TAG: ${{ needs.validate.outputs.image_tag }}
      # Local immutable tag. Never pushed; compose resolves it from this daemon.
      WITOP_APP_IMAGE: witop-production:${{ needs.validate.outputs.image_tag }}
      # Fixed in-container path, matching docker-compose.prod.yml.
      SQLSERVER_CONFIG: /run/secrets/sqlserver_config.json
      SQLSERVER_CONFIG_FILE: /Users/james/witop-prod/secrets/sqlserver_config.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      # Fix: remove credsStore=osxkeychain from Docker config.
      # launchd runner cannot access macOS keychain.
      # Without this, docker build pull fails on every public base image.
      - name: Patch Docker config (remove keychain store)
        uses: ./.github/actions/stub-osxkeychain

      # --- 0. Secret preflight ---------------------------------------------
      - name: Preflight - required secrets present
        run: |
          set -euo pipefail
          if [ -z "$SQLSERVER_CONFIG_JSON" ]; then
            echo "::error::SQLSERVER_CONFIG_JSON is not set for the production environment"
            exit 1
          fi
          # Validate JSON via stdin. The value is never printed.
          if ! printf '%s' "$SQLSERVER_CONFIG_JSON" \
              | python3 -c 'import json,sys; json.load(sys.stdin)'; then
            echo "::error::SQLSERVER_CONFIG_JSON is not valid JSON"
            exit 1
          fi
          echo "SQLSERVER_CONFIG_JSON present and valid."
        env:
          SQLSERVER_CONFIG_JSON: ${{ secrets.SQLSERVER_CONFIG_JSON }}

      # --- 1. Read-only shared SQL connectivity gate -------------------------
      - name: Check shared SQL connectivity (SELECT 1)
        env:
          SQLCMDPASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          : "${SQLCMDPASSWORD:?MSSQL_SA_PASSWORD is required}"
          # Docker Desktop supplies sqlcmd on the Mac runner. Pass only the
          # environment variable NAME to Docker; its value never enters argv.
          # Suppress tool output so failures cannot echo connection credentials.
          if ! docker run --rm \
              --env SQLCMDPASSWORD \
              mcr.microsoft.com/mssql-tools:latest \
              /opt/mssql-tools/bin/sqlcmd \
              -S "$SQL_SERVER,$SQL_PORT" -U "$SQL_USER" -d "$SQL_DATABASE" \
              -C -b -l 15 -Q "SELECT 1;" > /dev/null 2>&1; then
            echo "::error::Shared SQL connectivity check failed."
            exit 1
          fi
          echo "Shared SQL connectivity check passed."

      # --- 2. Stage deployment root ------------------------------------------
      - name: Prepare app directory and install compose file
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/secrets"
          chmod 700 "$APP_DIR/secrets"
          cp "$GITHUB_WORKSPACE/docker-compose.prod.yml" "$COMPOSE_FILE"
          chmod 644 "$COMPOSE_FILE"
          echo "Deployment root: $APP_DIR"
          ls -ld "$APP_DIR" "$APP_DIR/secrets" "$COMPOSE_FILE"

      # --- 3. Docker compose config validation --------------------------------
      - name: Validate docker compose configuration
        run: |
          set -euo pipefail
          # P1-3 fix: run config --services before touching the running stack.
          docker compose -f "$COMPOSE_FILE" config --services
          echo "docker compose config valid."

      # --- 4. SQL config secret -> 0600 bind-mount source ---------------------
      - name: Write SQL config secret file
        run: |
          set -euo pipefail
          printf '%s' "$SQLSERVER_CONFIG_JSON" > "$SQLSERVER_CONFIG_FILE"
          chmod 600 "$SQLSERVER_CONFIG_FILE"
          # Print the path and its mode only. The contents are never echoed.
          echo "Wrote SQL config to $SQLSERVER_CONFIG_FILE"
          stat -f 'mode=%Sp owner=%Su size=%z bytes' "$SQLSERVER_CONFIG_FILE"
        env:
          SQLSERVER_CONFIG_JSON: ${{ secrets.SQLSERVER_CONFIG_JSON }}

      # --- 5. Build the release image locally ---------------------------------
      # Skip docker/setup-buildx-action entirely: buildx invokes the osxkeychain
      # helper for every base-image pull, which fails under launchd.
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg NODE_IMAGE=node:22.23.3-bookworm-slim \
            --tag "$WITOP_APP_IMAGE" \
            --file ./Dockerfile \
            .
          echo "Built $WITOP_APP_IMAGE"
          docker images "$WITOP_APP_IMAGE" --format 'tag={{.Tag}} size={{.Size}}'

      # --- 6. Free port 8765 --------------------------------------------------
      - name: Stop local service holding port 8765
        run: |
          set -euo pipefail
          # Idempotent: the service may already be unloaded.
          launchctl bootout gui/$(id -u)/com.witop.reception-v4 || true
          ELAPSED=0
          while [ "$ELAPSED" -lt 15 ]; do
            if ! lsof -nP -iTCP:"$APP_PORT" -sTCP:LISTEN >/dev/null 2>&1; then
              echo "Port $APP_PORT free after ${ELAPSED}s."
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED+1))
          done
          if lsof -nP -iTCP:"$APP_PORT" -sTCP:LISTEN >/dev/null 2>&1; then
            echo "::error::port $APP_PORT is still held by another process:"
            lsof -nP -iTCP:"$APP_PORT" -sTCP:LISTEN
            exit 1
          fi

      # --- 7. Replace the old container ---------------------------------------
      - name: Stop and remove old container
        run: |
          set -euo pipefail
          # P1-3 fix: the build succeeds before this step, so the old container
          # keeps serving if the build fails.
          # Tolerate a first run where nothing is deployed yet.
          docker compose -f "$COMPOSE_FILE" stop app || true
          docker compose -f "$COMPOSE_FILE" rm -f app || true
          echo "Old container stopped and removed (if any)."

      - name: Bring up new container
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" up -d --no-build --no-deps app
          echo "Started $WITOP_APP_IMAGE on 127.0.0.1:$APP_PORT."

      # --- 8. Post-deploy /healthz gate ---------------------------------------
      - name: Wait for app container healthy and /healthz 200
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker compose -f "$COMPOSE_FILE" ps -q app)
          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::no running container found"
            exit 1
          fi
          echo "Waiting for container healthy (HEALTHCHECK timeout is 35s)..."
          ELAPSED=0
          STATUS=""
          while [ "$ELAPSED" -lt 240 ]; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$CONTAINER_ID" 2>/dev/null || echo none)
            case "$STATUS" in
              healthy)
                echo "Container healthy after ${ELAPSED}s."
                break
                ;;
              unhealthy)
                echo "::error::container unhealthy after ${ELAPSED}s"
                docker compose -f "$COMPOSE_FILE" logs --tail=200 app
                exit 1
                ;;
            esac
            sleep 3
            ELAPSED=$((ELAPSED+3))
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "::error::container did not become healthy in 240s (last: $STATUS)"
            docker compose -f "$COMPOSE_FILE" logs --tail=200 app
            exit 1
          fi
          BODY=$(curl -fsS --max-time "$SMOKE_MAX_TIME" \
            "http://127.0.0.1:$APP_PORT/healthz")
          echo "GET /healthz -> $BODY"

      # --- 9. Verify running container image -----------------------------------
      - name: Verify deployed image digest
        run: |
          set -euo pipefail
          # P0-5 fix: compare the running container's image ID against the tag
          # this run built. Either inspect failing (empty) exits 1 immediately.
          CONTAINER_ID=$(docker compose -f "$COMPOSE_FILE" ps -q app)
          if [ -z "$CONTAINER_ID" ]; then
            echo "::error::no running container found"
            exit 1
          fi
          EXPECTED_ID=$(docker inspect --format='{{.Id}}' "$WITOP_APP_IMAGE")
          RUNNING_IMAGE=$(docker inspect --format='{{.Image}}' "$CONTAINER_ID")
          echo "Expected image ID: $EXPECTED_ID"
          echo "Running container image ID: $RUNNING_IMAGE"
          if [ -z "$EXPECTED_ID" ] || [ -z "$RUNNING_IMAGE" ]; then
            echo "::error::image ID inspection failed (empty result)"
            exit 1
          fi
          if [ "$EXPECTED_ID" != "$RUNNING_IMAGE" ]; then
            echo "::error::Image mismatch — expected $EXPECTED_ID, running $RUNNING_IMAGE"
            exit 1
          fi
          echo "Digest verification passed."

  # ── Smoke test (post-deploy) ───────────────────────────────────────────────

  smoke:
    name: Smoke (real routes, local loopback)
    needs: [deploy, preflight]
    runs-on: [self-hosted, macos, ARM64, production]
    steps:
      # Probes the container port directly. 8913 is host nginx and returns 401
      # without Basic Auth, so it is not a CI target.
      - name: Probe real routes on loopback
        run: |
          set -euo pipefail
          FAILED=0
          read -r -a PATHS <<< "$SMOKE_PATHS"
          for path in "${PATHS[@]}"; do
            rc=0
            code=$(curl -fsS -o /dev/null -w '%{http_code}' \
              --max-time "$SMOKE_MAX_TIME" \
              "http://127.0.0.1:$APP_PORT$path") || rc=$?
            if [ "$rc" -ne 0 ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::smoke $path -> ${code:-000} (curl rc=$rc)"
              FAILED=$((FAILED+1))
            else
              echo "smoke $path -> $code"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED smoke probe(s) failed."
            exit 1
          fi
          echo "All smoke probes passed."

  # ── Finalize (DingTalk notification) ────────────────────────────────────────

  finalize:
    name: Finalize (DingTalk notify)
    needs: [validate, preflight, deploy, smoke]
    if: always()
    runs-on: [self-hosted, macos, ARM64, production]
    steps:
      # The deployed container is left running on purpose; there is nothing to
      # tear down, no registry session to close, and no per-run key material.
      - name: Notify DingTalk
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          TAG: ${{ needs.validate.outputs.image_tag }}
          REASON: ${{ needs.validate.outputs.reason }}
          WEBHOOK: ${{ secrets.DINGTALK_PROD_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_PROD_SECRET }}
        run: |
          set -euo pipefail
          # P1-2 fix: dingtalk errcode != 0 now causes the step to fail,
          # preventing false "success" reporting.
          if [ "$DEPLOY_RESULT" = "success" ] && \
             [ "$SMOKE_RESULT" = "success" ]; then
            OUTCOME="success"
            MSG="[PROD-DEPLOY] success tag=$TAG reason=$REASON"
          else
            OUTCOME="failure"
            MSG="[PROD-DEPLOY] FAILED deploy=$DEPLOY_RESULT smoke=$SMOKE_RESULT tag=$TAG reason=$REASON"
          fi
          TS=$(python3 -c 'import time; print(int(time.time()*1000))')
          SIG=$(printf '%s\n%s' "$TS" "$SECRET" \
                | openssl dgst -sha256 -hmac "$SECRET" -binary \
                | python3 -c 'import sys, urllib.parse, base64; print(urllib.parse.quote_plus(base64.b64encode(sys.stdin.buffer.read())))')
          URL="${WEBHOOK}&timestamp=${TS}&sign=${SIG}"
          BODY=$(jq -nc --arg text "$MSG" '{msgtype:"text", text:{content:$text}}')
          RESPONSE=$(curl -fsS -X POST -H 'Content-Type: application/json' \
                         --data "$BODY" --max-time 15 "$URL")
          ERRODE=$(printf '%s' "$RESPONSE" | python3 -c \
            'import sys,json; d=json.load(sys.stdin); print(d.get("errcode",-1))')
          if [ "$ERRODE" != "0" ]; then
            echo "::error::DingTalk errcode=$ERRODE (expected 0)"
            exit 1
          fi
          echo "DingTalk notification sent (outcome=$OUTCOME, errcode=$ERRODE)."