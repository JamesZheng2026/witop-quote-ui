name: witop-production

services:
  app:
    image: ${WITOP_APP_IMAGE:?Set WITOP_APP_IMAGE to an immutable tag or digest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Values are FILE PATHS, not inline credentials.
      SQLSERVER_CONFIG: ${SQLSERVER_CONFIG:?Set SQLSERVER_CONFIG to /run/secrets/sqlserver_config.json}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:?Set ANTHROPIC_API_KEY_FILE to /run/secrets/anthropic_api_key}
      WITOP_AI_ACCESS_TOKEN_FILE: ${WITOP_AI_ACCESS_TOKEN_FILE:?Set WITOP_AI_ACCESS_TOKEN_FILE to /run/secrets/ai_access_token}
    volumes:
      - type: bind
        source: ${SQLSERVER_CONFIG_FILE:?Set the external host SQL config file path}
        target: /run/secrets/sqlserver_config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ANTHROPIC_API_KEY_SOURCE:?Set the external host Claude API key file path}
        target: /run/secrets/anthropic_api_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WITOP_AI_ACCESS_TOKEN_SOURCE:?Set the external host AI access-token file path}
        target: /run/secrets/ai_access_token
        read_only: true
        bind: {create_host_path: false}
    expose:
      - "8765"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to an approved tag or digest}
    # Skip the official image's config-writing entrypoint on a read-only rootfs.
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Keep loopback by default; bind only a VPN/private interface for remote access.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NGINX_AUTH_FILE:?Set external htpasswd file path}
        target: /etc/nginx/auth/htpasswd
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, -T, "35", -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 40s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=755
      - /tmp:size=8m,mode=1777
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  # App needs outbound routing to SQL Server. Never publish its 8765 port.
  backend:
    driver: bridge
